<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b1424">
<title>SUMEX 최은성의 AI SALES LAB</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#0b1424;--bg2:#101c30;--card:#14233b;--card2:#192b47;--line:#24385a;--tx:#e8eef8;--mut:#8fa3c0;--ac:#4f9dff;--teal:#19c3b1;--ok:#2ecc8f;--warn:#f5a623;--red:#ff6b6b;--vio:#a78bfa;--pink:#ff8fb1;
--font:"Pretendard Variable","Pretendard","Malgun Gothic",system-ui,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.55 var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit}
#gate{position:fixed;inset:0;background:radial-gradient(900px 500px at 70% 0%,#1a4c8a55,transparent 60%),var(--bg);display:flex;align-items:center;justify-content:center;z-index:100}
#gate .box{width:min(420px,92vw);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:34px 30px;box-shadow:0 30px 80px #000a}
#gate h1{margin:0 0 6px;font-size:22px}#gate h1 b{color:var(--teal)}#gate p{margin:0 0 20px;color:var(--mut)}
#gate input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--tx);font:inherit;font-size:16px;margin-bottom:10px}
#gate button{width:100%;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-weight:800;font-size:16px;cursor:pointer}
#gate .err{color:var(--red);margin-top:10px;min-height:20px}
header{position:sticky;top:0;z-index:30;background:#0b1424ee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;padding:10px 22px;flex-wrap:wrap}
.brand{font-weight:900;font-size:17px;letter-spacing:.2px;white-space:nowrap}.brand b{color:var(--teal)}.brand small{display:block;font-weight:500;color:var(--mut);font-size:11px;letter-spacing:0}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav button{white-space:nowrap;flex:none;background:transparent;border:1px solid transparent;color:var(--mut);padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:600}
nav button:hover{background:var(--card)}nav button.on{background:var(--ac);color:#fff}
main{max-width:1280px;margin:0 auto;padding:22px}
h2{margin:0 0 14px;font-size:20px}h2 small{color:var(--mut);font-weight:500;font-size:13px;margin-left:8px}
h3{margin:0 0 10px;font-size:15px;color:#cfe0f8}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.kpi b{display:block;font-size:28px;letter-spacing:-.5px;margin-top:2px}.kpi span{color:var(--mut);font-size:12.5px}.kpi i{font-style:normal;color:var(--mut);font-size:12px}
.row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #1d3050}.row:last-child{border-bottom:0}
.tm{min-width:54px;color:var(--mut);font-size:12px;padding-top:2px}
.bd{display:inline-block;font-size:11px;font-weight:700;padding:1px 9px;border-radius:999px;margin-right:4px;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.bd.h{background:#1f3a63;color:#bcd6ff;border-color:#2c4f84}
.t-선납{color:#6fc3ff;border-color:#2a5a80}.t-판매{color:var(--ok);border-color:#1f6b52}.t-가납랜딩{color:var(--warn);border-color:#7a5a1d}.t-교환{color:var(--pink);border-color:#7a3a55}.t-샘플{color:#c1a0ff;border-color:#5a4a99}
.t-데모{color:#7ef0e0;border-color:#1d7a72}.t-수리{color:#ffb27a;border-color:#8a5530}.t-견적서{color:#ffe27a;border-color:#8a7a30}.t-서류등록{color:#9fb4ff;border-color:#35467a}.t-납품{color:#9be39b;border-color:#2f6a2f}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.chip{padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--mut);font-weight:600;font-size:13px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
input.f,select.f,textarea.f{background:var(--bg2);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:9px 12px;font:inherit}
input.f:focus,select.f:focus{outline:2px solid #4f9dff55}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.btn{background:var(--ac);border:0;color:#fff;font-weight:700;border-radius:10px;padding:9px 16px;cursor:pointer}.btn.g{background:var(--card2);border:1px solid var(--line);color:var(--tx)}
.sum{color:var(--mut);font-size:13px;white-space:pre-wrap;margin-top:3px}.more{color:var(--ac);cursor:pointer;font-size:12px}
.lay{display:grid;grid-template-columns:250px 1fr;gap:16px;align-items:start}
.side{position:sticky;top:76px;max-height:calc(100vh - 100px);overflow:auto;padding:8px}
.si{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:10px;cursor:pointer}.si:hover{background:var(--card2)}.si.on{background:var(--card2);outline:1px solid var(--ac)}.si span{color:var(--mut);font-size:12px}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:8px 10px;border-bottom:1px solid #1d3050;text-align:left;vertical-align:top}th{color:var(--mut);font-weight:600;position:sticky;top:0;background:var(--card)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cal .dh{background:var(--card2);padding:8px;text-align:center;color:var(--mut);font-weight:700}
.cal .dc{background:var(--card);min-height:104px;padding:6px;cursor:pointer;position:relative}.cal .dc.out{opacity:.35}.cal .dc.today{outline:2px solid var(--teal);outline-offset:-2px}.cal .dc.sel{background:var(--card2)}
.cal .dn{font-weight:700;font-size:12px;color:var(--mut)}
.ev{font-size:11.5px;padding:1px 6px;border-radius:5px;margin-top:2px;background:#1f3a63;color:#cfe3ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ev.rec{background:#1d2a40;color:var(--mut)}.ev.td{background:#4a3a14;color:#ffdf9a}.ev.dl{background:#14463a;color:#aef0d8}
.bar2{height:8px;border-radius:6px;background:#1d3050;overflow:hidden;min-width:80px}.bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--ac))}
.todo{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid #1d3050}
.todo input[type=checkbox]{width:18px;height:18px;margin-top:3px;accent-color:var(--teal)}.todo.done .tt{text-decoration:line-through;color:var(--mut)}
.x{color:var(--mut);cursor:pointer;padding:0 6px}.x:hover{color:var(--red)}
#modal{position:fixed;inset:0;background:#000b;display:none;z-index:90;align-items:center;justify-content:center}#modal.on{display:flex}
#modal .bx{background:var(--card);border:1px solid var(--line);border-radius:16px;width:min(1000px,94vw);height:90vh;display:flex;flex-direction:column}
#modal .tb{padding:10px 16px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line)}
#mb{flex:1;display:flex}#mb iframe,#mb img{flex:1;border:0;width:100%;background:#fff;object-fit:contain}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.doc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}.doc:hover{border-color:var(--ac)}.doc .nm{font-size:12.5px;word-break:break-all;margin:6px 0}
.lchip{display:inline-flex;gap:5px;align-items:center;border-radius:999px;padding:2px 4px 2px 10px;font-size:12px;font-weight:700;margin:2px 3px 2px 0}.lchip b{background:#ffffff33;border-radius:999px;min-width:20px;text-align:center;padding:0 5px}
.note{background:#18325a;border-radius:12px;padding:10px 14px;color:#cfe0f8;font-size:13px;margin-bottom:14px}
.mut{color:var(--mut)}
.foot{margin:40px 0 20px;text-align:center}.foot span{display:inline-flex;gap:10px;align-items:center;padding:9px 18px;border-radius:999px;background:linear-gradient(135deg,#1b2540,#2c3e75);font-weight:800;font-size:13px}.foot i{font-style:normal;background:var(--ac);border-radius:6px;padding:2px 7px;font-size:11px}.foot b{color:#8fb4ff}
@media(max-width:900px){.g4,.g3,.g2,.g21{grid-template-columns:1fr 1fr}.lay{grid-template-columns:1fr}.side{position:static;max-height:260px}main{padding:14px}nav{margin-left:0;width:100%;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;padding-bottom:2px}nav::-webkit-scrollbar{display:none}.cal .dc{min-height:72px}}
@media(max-width:560px){.g4,.g3,.g2,.g21{grid-template-columns:1fr}.cal .ev{font-size:10px}}
</style>
</head>
<body>
<div id="gate"><div class="box"><h1>SUMEX <b>최은성의 AI SALES LAB</b></h1><p>접속 코드를 입력해 주세요.</p><input id="pw" type="password" placeholder="접속 코드" autocomplete="current-password"><button id="go">열기</button><div class="err" id="err"></div></div></div>
<header><div class="bar"><div class="brand">SUMEX <b>AI SALES LAB</b><small>최은성 영업 일지 · 납품 · 일정</small></div><nav id="nav"></nav></div></header>
<main id="main"></main>
<div id="modal"><div class="bx"><div class="tb"><span id="mt"></span><span><a class="mut" style="cursor:pointer" onclick="LAB.closeModal()">닫기 ✕</a></span></div><div id="mb"></div></div></div>
<script src="lab_app.js"></script>
</body>
</html>
